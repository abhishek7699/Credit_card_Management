name: CI
# Builds all seven microservices, enforces 100% JaCoCo instruction+branch coverage,
# builds Docker images, starts the full compose stack, and runs end-to-end integration
# tests covering payment submission, rate limiting, circuit breaking, and settlement.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pin compose project name so the auth-mock network name is predictable
  COMPOSE_PROJECT_NAME: credit_card
  # Same dev-only values from .env.example — not real secrets (see SECURITY.md:
  # CockroachDB runs --insecure and ignores these; Vault dev mode just needs
  # every service to agree on one token string). Supplied here directly,
  # matching docker-compose.yml's ${DB_USERNAME}/${DB_PASSWORD}/${VAULT_DEV_ROOT_TOKEN}
  # references and scripts/e2e-test.sh's own use of VAULT_DEV_ROOT_TOKEN.
  DB_USERNAME: root
  DB_PASSWORD: ""
  VAULT_DEV_ROOT_TOKEN: dev-root-token

jobs:
  frontend-build-test:
    # Independent of the backend job below — needs nothing from it (no
    # backend running), so it runs in parallel instead of waiting behind the
    # slower Gradle build + e2e run.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

      - name: Test with coverage (100% gate on this layer's own files — vite.config.ts)
        working-directory: frontend
        run: npm run test:coverage

  build-test-e2e:
    # Was pinned to ubuntu-24.04: ubuntu-latest's migration to the
    # ubuntu-26.04 image (started ~2026-10-19) shipped a Docker Engine whose
    # minimum API version Testcontainers 1.19.7's default client fallback
    # (1.32) couldn't satisfy, so every Testcontainers-backed test failed
    # with "DockerClientProviderStrategy" before any test code ran. Fixed at
    # the source instead of staying pinned: Testcontainers 2.0.5 bumped that
    # default to 1.44, which is what ubuntu-26.04's Docker actually requires.
    # Back on the floating ubuntu-latest label now that the real
    # incompatibility is resolved -- see this PR's CI run for confirmation.
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7

      # ── 2. JDK 17 ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Cache ─────────────────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 3. Build + unit/integration tests + JaCoCo 100% coverage gate ────────
      - name: Build and verify coverage
        run: |
          chmod +x gradlew
          # build compiles + runs tests + produces bootJars (needed by Dockerfiles)
          # jacocoTestCoverageVerification enforces 100% instruction+branch gate
          # --max-workers=2 keeps heap pressure safe on the 7-GB CI runner
          ./gradlew build jacocoTestCoverageVerification \
            --no-daemon \
            --max-workers=2 \
            --continue

      # ── 4. Build Docker images ────────────────────────────────────────────────
      - name: Build Docker images
        run: docker compose build

      # ── 5. Start the full stack ───────────────────────────────────────────────
      - name: Start services
        run: docker compose up -d

      - name: Dump Vault logs on startup failure
        if: failure()
        run: docker compose logs vault

      # ── 6. Wait for all 7 services to become healthy ─────────────────────────
      - name: Wait for services to become healthy
        timeout-minutes: 3
        run: |
          # Management/actuator ports as exposed on the CI host
          declare -A SERVICES=(
            [api-gateway]=8088
            [transaction-service]=8081
            [authorization-service]=8082
            [fraud-detection-service]=8083
            [settlement-service]=8085
            [notification-service]=8084
            [reporting-service]=8091
            [booking-service]=8092
          )

          DEADLINE=$(( SECONDS + 150 ))
          ALL_HEALTHY=0

          for NAME in "${!SERVICES[@]}"; do
            PORT="${SERVICES[$NAME]}"
            echo "⏳ Waiting for $NAME on :$PORT/actuator/health …"
            until curl -sf "http://localhost:${PORT}/actuator/health" > /dev/null 2>&1; do
              if [[ $SECONDS -ge $DEADLINE ]]; then
                echo "❌ Timeout waiting for $NAME"
                docker compose logs "$NAME" --tail=80
                ALL_HEALTHY=1
                break
              fi
              sleep 3
            done
            [[ $ALL_HEALTHY -eq 0 ]] && echo "✅ $NAME is healthy"
          done

          if [[ $ALL_HEALTHY -ne 0 ]]; then
            echo "One or more services failed to become healthy — aborting."
            exit 1
          fi

      # ── Install grpcurl (required by e2e-test.sh) ────────────────────────────
      - name: Install grpcurl
        run: |
          GRPCURL_VER=1.9.1
          curl -sSL \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VER}/grpcurl_${GRPCURL_VER}_linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin grpcurl
          grpcurl -version

      # ── 7. End-to-end integration tests ──────────────────────────────────────
      - name: Run e2e tests
        run: |
          chmod +x scripts/e2e-test.sh
          bash scripts/e2e-test.sh

      # ── Diagnostic logs on e2e failure ───────────────────────────────────────
      - name: Dump api-gateway and transaction-service logs on e2e failure
        if: failure()
        run: docker compose logs api-gateway transaction-service --tail=100

      # ── Playwright smoke test (layer 2d) — reuses this job's already-running
      #    stack (including the auth-mock service e2e-test.sh left standing;
      #    it tears down its own ephemeral one but auth-mock is docker-compose
      #    managed, unaffected) instead of standing up a second one ────────────
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        run: nohup npm run dev > /tmp/vite-dev.log 2>&1 &

      - name: Wait for frontend dev server
        run: |
          until curl -sf http://localhost:5173/ > /dev/null 2>&1; do sleep 1; done

      - name: Run Playwright smoke test
        working-directory: frontend
        run: npx playwright test

      - name: Dump Vite dev server log on Playwright failure
        if: failure()
        run: cat /tmp/vite-dev.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # ── 8. Tear down (always runs — success or failure) ───────────────────────
      - name: Tear down
        if: always()
        run: docker compose down -v

      # ── Upload JaCoCo reports on failure for debugging ────────────────────────
      - name: Upload coverage reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/'
          retention-days: 7
