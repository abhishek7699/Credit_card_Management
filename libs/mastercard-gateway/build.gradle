plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
    id 'java-test-fixtures'
}

group = 'com.creditcard'
version = '0.0.1-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.2.5'
    }
}

dependencies {
    // RestClient and the JDK HTTP client factory (Spring 6.1, via Boot 3.2.5)
    api 'org.springframework:spring-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.slf4j:slf4j-api'

    // WireMock is shared through the test fixtures so authorization-service can test against the same TLS server
    testFixturesApi 'com.github.tomakehurst:wiremock-jre8-standalone:2.35.1'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'ch.qos.logback:logback-classic'
}

jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.0
            }
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

check {
    dependsOn jacocoTestCoverageVerification
}
