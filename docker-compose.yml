services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  cockroachdb:
    image: cockroachdb/cockroach:v23.2.0
    command:
      - start-single-node
      - --insecure
      - "--store=type=mem,size=640MiB"
      - "--max-sql-memory=128MiB"
      - "--log={file-defaults: {dir: /tmp}}"
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
    ports:
      - "8200:8200"
    # Start the dev server, then provision the transit secrets engine and the
    # card-pan-key encryption key that transaction-service's TokenizationService
    # requires (see specs/001-transaction-service/research.md). The key is
    # convergent + derived so the same PAN + context always yields the same
    # ciphertext — authorization-service uses the card token as a lookup key and
    # the e2e harness seeds a matching card_accounts row. The dev server is
    # in-memory, so this must run on every container start.
    command:
      - sh
      - -c
      - |
        vault server -dev -dev-listen-address=0.0.0.0:8200 &
        until vault status >/dev/null 2>&1; do sleep 1; done
        vault secrets enable transit 2>/dev/null || true
        vault write transit/keys/card-pan-key type=aes256-gcm96 convergent_encryption=true derived=true
        wait
    healthcheck:
      # Healthy only once the transit key exists, so dependents wait for provisioning.
      test: ["CMD", "sh", "-c", "vault status >/dev/null 2>&1 && vault read transit/keys/card-pan-key >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dev-only JWT issuer for the staff frontend (layer 2d) — NOT a real identity
  # provider, see SECURITY.md. Separate from scripts/e2e-test.sh's own ephemeral
  # auth-mock container: that script force-recreates/removes any container named
  # auth-service regardless of this one, so the two don't conflict.
  auth-mock:
    image: python:3.11-slim
    container_name: auth-service
    command: ["sh", "-c", "pip install --quiet --disable-pip-version-check --root-user-action=ignore cryptography && python3 /app/dev-auth-mock.py"]
    volumes:
      - ./scripts/dev-auth-mock.py:/app/dev-auth-mock.py:ro
    ports:
      - "9000:9000"

  # ── Microservices ─────────────────────────────────────────────────────────

  transaction-service:
    build:
      context: .
      dockerfile: services/transaction-service/Dockerfile
    depends_on:
      cockroachdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      vault:
        condition: service_healthy
    ports:
      - "9090:9090"
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://cockroachdb:26257/defaultdb?sslmode=disable&currentSchema=transaction_service
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
      SPRING_VAULT_HOST: vault
      SPRING_VAULT_PORT: 8200
      SPRING_VAULT_SCHEME: http
      SPRING_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}

  authorization-service:
    build:
      context: .
      dockerfile: services/authorization-service/Dockerfile
    depends_on:
      cockroachdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://cockroachdb:26257/defaultdb?sslmode=disable&currentSchema=authorization_service
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  fraud-detection-service:
    build:
      context: .
      dockerfile: services/fraud-detection-service/Dockerfile
    depends_on:
      cockroachdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://cockroachdb:26257/defaultdb?sslmode=disable&currentSchema=fraud_detection_service
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  settlement-service:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    depends_on:
      cockroachdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8089:8080"
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://cockroachdb:26257/defaultdb?sslmode=disable&currentSchema=settlement_service
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SETTLEMENT_INTERCHANGE_FEE_RATE: "0.02"
      SETTLEMENT_BATCH_CRON: "0 59 23 * * *"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on:
      cockroachdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://cockroachdb:26257/defaultdb?sslmode=disable&currentSchema=notification_service
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  reporting-service:
    build:
      context: .
      dockerfile: services/reporting-service/Dockerfile
    depends_on:
      cockroachdb:
        condition: service_healthy
      settlement-service:
        condition: service_started
    ports:
      - "8086:8086"
      - "8091:8091"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://cockroachdb:26257/defaultdb?sslmode=disable&currentSchema=settlement_service
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    depends_on:
      cockroachdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      transaction-service:
        condition: service_started
    ports:
      - "8093:8080"
      - "8092:8092"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://cockroachdb:26257/defaultdb?sslmode=disable&currentSchema=booking_service
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRANSACTION_SERVICE_GRPC_ADDRESS: static://transaction-service:9090

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      transaction-service:
        condition: service_started
      reporting-service:
        condition: service_started
      booking-service:
        condition: service_started
    ports:
      - "8087:8080"
      - "8088:8090"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_JWKS_URI: http://auth-service:9000/.well-known/jwks.json
      TRANSACTION_SERVICE_GRPC_ADDRESS: static://transaction-service:9090
      REPORTING_SERVICE_URL: http://reporting-service:8086
      BOOKING_SERVICE_URL: http://booking-service:8080

