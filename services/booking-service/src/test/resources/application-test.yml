spring:
  flyway:
    enabled: true
    schemas: public
    create-schemas: false
  jpa:
    hibernate:
      # validate, not none: matching the main profile is what actually lets tests
      # catch a schema/entity mismatch (e.g. the CockroachDB INT-vs-INT4 bug) --
      # ddl-auto: none would silently skip the exact check that caught it.
      ddl-auto: validate
