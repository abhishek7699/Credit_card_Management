server:
  port: 8080

management:
  server:
    port: 8090
  # Tracing is always on (trace ids in logs); spans are exported only when sampled. Dev compose sets 1.0.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    circuitbreakers:
      enabled: true

spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_JWKS_URI:http://auth-service:9000/.well-known/jwks.json}
  cloud:
    gateway:
      # Routes are registered programmatically in RouteConfig.java
      default-filters: []

grpc:
  client:
    transaction-service:
      address: ${TRANSACTION_SERVICE_GRPC_ADDRESS:static://transaction-service:9090}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s

gateway:
  grpc:
    warmup:
      timeout: 120s
      poll-interval: 2s
  # Requests per second (replenish) and burst, per key. Authenticated routes key by JWT
  # subject; the public guest routes key by client IP and use their own, stricter limit.
  rate-limit:
    public:
      replenish-rate: ${GATEWAY_PUBLIC_RATE_LIMIT_REPLENISH:5}
      burst-capacity: ${GATEWAY_PUBLIC_RATE_LIMIT_BURST:10}

resilience4j:
  circuitbreaker:
    instances:
      transaction-service-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
      reporting-service-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      booking-service-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
      booking-submit-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true

logging:
  level:
    root: INFO
    com.creditcard: INFO
    io.github.resilience4j: WARN

# Swagger UI (/swagger-ui.html) and OpenAPI spec (/v3/api-docs) are OFF by default, so
# GKE and any run without a profile expose no API docs. Enabled by application-local.yml
# and application-dev.yml only.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
