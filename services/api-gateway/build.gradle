plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.google.protobuf' version '0.9.4'
    id 'jacoco'
}

group = 'com.creditcard'
version = '0.0.1-SNAPSHOT'

ext {
    grpcVersion           = '1.63.0'
    protobufVersion       = '3.25.3'
    lognetGrpcVersion     = '3.1.0.RELEASE'
    testcontainersVersion = '1.19.7'
    springCloudVersion    = '2023.0.1'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring Cloud Gateway (reactive Netty)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

    // Spring Security — OAuth2 Resource Server (reactive JWT validation)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Resilience4j circuit breaker (reactive — required by Spring Cloud Gateway)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // Redis reactive (RedisRateLimiter)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // gRPC — client-side only (LogNet starter, same version as transaction-service)
    implementation "net.devh:grpc-client-spring-boot-starter:${lognetGrpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-netty:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"

    // Required by gRPC generated stubs
    compileOnly 'jakarta.annotation:jakarta.annotation-api'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // Micrometer distributed tracing
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

    // Structured JSON logging
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // ── Test dependencies ──────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'

    // gRPC in-process server for unit/integration tests
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"

    // Testcontainers (Redis)
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"

    // WireMock for HTTP mock (reporting-service)
    testImplementation 'com.github.tomakehurst:wiremock-jre8-standalone:2.35.1'

    // JWT generation for tests
    testImplementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── Protobuf plugin — reuse proto from repo root ───────────────────────────
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
    generatedFilesBaseDir = "$buildDir/generated/source/proto"
}

sourceSets {
    main {
        proto {
            srcDir "${rootProject.projectDir}/proto"
        }
        java {
            srcDirs += [
                "$buildDir/generated/source/proto/main/java",
                "$buildDir/generated/source/proto/main/grpc"
            ]
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava.dependsOn generateProto
compileTestJava.dependsOn generateProto

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.11'
}

def jacocoExcludes = [
    '**/ApiGatewayApplication.class',
    '**/transaction/grpc/**',
]

def filteredClassDirs = {
    fileTree(dir: "${buildDir}/classes/java/main", excludes: jacocoExcludes)
}

jacocoTestReport {
    // Explicit dependency: classDirectories below is rebuilt from a raw
    // buildDir path string (via fileTree), which carries no implicit task
    // dependency back to compileJava/processResources. Declare it
    // explicitly so Gradle's task dependency validation doesn't flag this
    // task for reading those tasks' outputs without a declared dependency.
    dependsOn test, compileJava, processResources
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(filteredClassDirs))
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value   = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                value   = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
    classDirectories.setFrom(files(filteredClassDirs))
}

