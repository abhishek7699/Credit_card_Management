plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
}

group = 'com.creditcard'
version = '0.0.1-SNAPSHOT'

ext {
    testcontainersVersion = '1.19.7'
}

dependencies {
    // Exposes /actuator/prometheus for k8s/monitoring to scrape
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Spring Boot core
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Spring Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Spring Retry (SQLSTATE 40001 + OptimisticLockingFailureException retries)
    implementation 'org.springframework.retry:spring-retry'

    // Database — CockroachDB uses PostgreSQL wire protocol
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway database migrations
    implementation 'org.flywaydb:flyway-core'

    // Micrometer distributed tracing (propagates trace ID in Kafka headers)
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

    // Structured JSON logging
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // ── Test dependencies ──────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:kafka:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    testImplementation 'org.awaitility:awaitility'
}

// ── JaCoCo — 100% instruction + branch coverage gate ──────────────────────────
jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    // Explicit dependency: afterEvaluate below rebuilds classDirectories from
    // resolved File paths (via fileTree), which drops the implicit task
    // dependency normally carried by sourceSets.main.output. Declare it
    // explicitly so Gradle's task dependency validation doesn't flag this
    // task for reading compileJava/processResources outputs without a
    // declared dependency.
    dependsOn test, compileJava, processResources
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/creditcard/authorization/AuthorizationServiceApplication.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/creditcard/authorization/AuthorizationServiceApplication.class'
            ])
        }))
    }
    violationRules {
        rule {
            excludes = [
                'com.creditcard.authorization.AuthorizationServiceApplication'
            ]
            limit {
                counter = 'INSTRUCTION'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.0
            }
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

check {
    dependsOn jacocoTestCoverageVerification
}
