spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    schemas: public
    create-schemas: false
  kafka:
    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.creditcard.authorization.kafka.event.TransactionInitiatedEvent

management:
  server:
    port: 0
