spring:
  application:
    name: authorization-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: authorization-service-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.creditcard.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.creditcard.authorization.kafka.event.TransactionInitiatedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        retries: 3
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: authorization_service
    create-schemas: true

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  config: classpath:logback-spring.xml

# Payment processor (spec 014). The simulator is the default. Mastercard settings are read only when selected.
# Secrets come from the environment only; never commit them.
payment:
  processor: ${PAYMENT_PROCESSOR:simulated}

mastercard:
  api-version: ${MASTERCARD_API_VERSION:100}
  base-url: ${MASTERCARD_BASE_URL:}
  merchant-id: ${MASTERCARD_MERCHANT_ID:}
  api-password: ${MASTERCARD_API_PASSWORD:}
  connect-timeout-seconds: 5
  read-timeout-seconds: ${MASTERCARD_READ_TIMEOUT_SECONDS:10}
