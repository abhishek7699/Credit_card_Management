spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-service-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.creditcard.*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification_service
    create-schemas: true

management:
  server:
    port: 8084
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  config: classpath:logback-spring.xml

# Swagger UI (/swagger-ui.html) and OpenAPI spec (/v3/api-docs) are OFF by default, so
# GKE and any run without a profile expose no API docs. Enabled by application-local.yml
# and application-dev.yml only.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Email is log-only unless notification.channels.email.enabled=true (compose sets it for
# local runs and sends to Mailpit). Retry: max-attempts includes the first send.
notification:
  channels:
    email:
      enabled: false
      from: notifications@creditcard.local
  delivery:
    max-attempts: 3
    backoff-millis: 1000
