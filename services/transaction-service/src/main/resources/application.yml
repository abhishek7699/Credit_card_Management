spring:
  application:
    name: transaction-service
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: transaction_service
    create-schemas: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        enable.idempotence: true
    consumer:
      group-id: transaction-service-status-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.creditcard.transaction.event"
    listener:
      ack-mode: manual_immediate

grpc:
  server:
    port: 9090

management:
  server:
    port: 8081
  # Tracing is always on (trace ids in logs); spans are exported only when sampled. Dev compose sets 1.0.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Request idempotency (InitiateTransaction Idempotency-Key): how long a key is honored.
idempotency:
  ttl: PT24H

# HashiCorp Vault connection (spring-vault-core — NOT spring-cloud-vault)
vault:
  host: ${VAULT_HOST:localhost}
  port: ${VAULT_PORT:8200}
  scheme: ${VAULT_SCHEME:http}
  token: ${VAULT_TOKEN:}
  transit:
    key-name: ${VAULT_TRANSIT_KEY:card-pan-key}

logging:
  level:
    root: INFO
    com.creditcard: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"

# ValidateCard (guest pay-later bookings): real Mastercard Account Validation. OFF by default, so CI and
# the e2e need no Mastercard credentials; when off, a well-formed card always passes. The dev profile
# (application-dev.yml) turns it on.
card-validation:
  enabled: ${CARD_VALIDATION_ENABLED:false}
  timeout-seconds: ${CARD_VALIDATION_TIMEOUT_SECONDS:6}
  reference-prefix: ""

transaction:
  outbox:
    poll-interval-ms: ${TRANSACTION_OUTBOX_POLL_MS:500}
    max-attempts: ${TRANSACTION_OUTBOX_MAX_ATTEMPTS:5}
  # 013 timers, in seconds unless noted. Checked at startup by TimerOrdering.
  timeouts:
    pending-timeout-seconds: ${TRANSACTION_PENDING_TIMEOUT_SECONDS:300}   # P (owner: 300 s)
    sweep-interval-ms: ${TRANSACTION_SWEEP_INTERVAL_MS:30000}            # I (owner: 30 s)
    sweep-enabled: ${TRANSACTION_SWEEP_ENABLED:true}
    max-delivery-lag-seconds: 60                                          # K (owner: 60 s)
    mastercard-read-timeout-seconds: ${MASTERCARD_READ_TIMEOUT_SECONDS:10}                                   # M
    status-retrieve-buffer-seconds: 2                                     # b (R = 2M + b = 22 s)
    margin-seconds: 60                                                    # m (owner: 60 s)
