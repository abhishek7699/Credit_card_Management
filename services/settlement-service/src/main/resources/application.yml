spring:
  application:
    name: settlement-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: settlement-service-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.creditcard.*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: settlement_service
    create-schemas: true

server:
  port: 8080

management:
  server:
    port: 8085
  # Tracing is always on (trace ids in logs); spans are exported only when sampled. Dev compose sets 1.0.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

settlement:
  interchange-fee-rate: 0.02
  # Display label only: stored on each settlement batch and returned by reporting. No bank connection.
  acquirer:
    name: ${SETTLEMENT_ACQUIRER_NAME:Chase}
  batch:
    chunk-size: 100
    cron: "0 59 23 * * *"

logging:
  config: classpath:logback-spring.xml

# Payment processor (spec 014). Same setting and env names as authorization-service.
# The simulator captures nothing (default). Mastercard captures authorized transactions before they settle.
payment:
  processor: ${PAYMENT_PROCESSOR:simulated}

mastercard:
  api-version: ${MASTERCARD_API_VERSION:100}
  base-url: ${MASTERCARD_BASE_URL:}
  merchant-id: ${MASTERCARD_MERCHANT_ID:}
  api-password: ${MASTERCARD_API_PASSWORD:}
  connect-timeout-seconds: 5
  read-timeout-seconds: ${MASTERCARD_READ_TIMEOUT_SECONDS:10}

# Swagger UI (/swagger-ui.html) and OpenAPI spec (/v3/api-docs) are OFF by default, so
# GKE and any run without a profile expose no API docs. Enabled by application-local.yml
# and application-dev.yml only.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
