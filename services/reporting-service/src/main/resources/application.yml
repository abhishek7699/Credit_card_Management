spring:
  application:
    name: reporting-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false

server:
  port: 8086

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  config: classpath:logback-spring.xml

# Swagger UI (/swagger-ui.html) and OpenAPI spec (/v3/api-docs) are OFF by default, so
# GKE and any run without a profile expose no API docs. Enabled by application-local.yml
# and application-dev.yml only.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
