apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: credit-card
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']
        - name: wait-for-transaction-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z transaction-service 8081; do echo waiting for transaction-service; sleep 2; done']
        - name: wait-for-reporting-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z reporting-service 8091; do echo waiting for reporting-service; sleep 2; done']
      containers:
        - name: api-gateway
          image: credit-card/api-gateway:local
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8090
              name: management
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m -XX:MaxMetaspaceSize=128m"
          envFrom:
            - secretRef:
                name: api-gateway-secrets
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # See transaction-service/deployment.yaml for why: gives a slow
          # cold start up to 5 minutes before the liveness probe's own
          # tighter steady-state timing takes over.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
