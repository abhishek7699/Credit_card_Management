apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: credit-card
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: management
      port: 8090
      targetPort: 8090
      protocol: TCP
