apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-service
  namespace: credit-card
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-detection-service
  template:
    metadata:
      labels:
        app: fraud-detection-service
    spec:
      initContainers:
        - name: wait-for-cockroachdb
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://cockroachdb:8080/health?ready=1; do echo waiting for cockroachdb; sleep 2; done']
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done']
      containers:
        - name: fraud-detection-service
          image: credit-card/fraud-detection-service:local
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          ports:
            - containerPort: 8083
              name: management
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m -XX:MaxMetaspaceSize=128m"
          envFrom:
            - secretRef:
                name: fraud-detection-service-secrets
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # See transaction-service/deployment.yaml for why: gives a slow
          # cold start up to 5 minutes before the liveness probe's own
          # tighter steady-state timing takes over.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
