apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: credit-card
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: reporting-service
          image: reporting-service:latest
          ports:
            - containerPort: 8086
              name: http
            - containerPort: 8091
              name: management
          envFrom:
            - secretRef:
                name: reporting-service-secrets
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8091
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
