# The actual dashboard JSON Grafana auto-loads via the file provider
# configured in grafana.yaml's grafana-dashboard-provider ConfigMap. Kept as
# its own file/ConfigMap since it's large and edited independently of the
# Grafana Deployment itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: credit-card
data:
  credit-card-services.json: |
    {
      "title": "Credit Card Payment Gateway — Services",
      "uid": "credit-card-services",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-30m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Request rate (req/s, per service and protocol)",
          "description": "Combines three request families, each labeled by protocol: HTTP (Spring MVC/WebFlux http_server_requests_seconds, actuator endpoints excluded so health checks and Prometheus's own scrape don't count as traffic), gRPC (transaction-service's grpc_server_processing_duration_seconds), and Kafka (the consumer services' spring_kafka_listener_seconds, one sample per consumed message). A 20s rate() window (with Prometheus now scraping every 5s) keeps short bursts -- e.g. Step 7's 100 requests in ~1s -- visible as a spike instead of averaged away over a full minute.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (job, protocol) (label_replace(rate(http_server_requests_seconds_count{uri!~\"/actuator.*\"}[20s]), \"protocol\", \"http\", \"job\", \"(.*)\") or label_replace(rate(grpc_server_processing_duration_seconds_count[20s]), \"protocol\", \"grpc\", \"job\", \"(.*)\") or label_replace(rate(spring_kafka_listener_seconds_count[20s]), \"protocol\", \"kafka\", \"job\", \"(.*)\"))",
              "legendFormat": "{{job}} ({{protocol}})"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (% of requests failing, per service and protocol)",
          "description": "HTTP error = status 5xx (actuator and the circuit-breaker fallback route excluded here, see below) + gateway_fallback_requests_total; gRPC error = statusCode != OK; Kafka error = listener result != success. The fallback route is split out into its own dedicated, eagerly-registered counter (FallbackController) rather than relying on Spring's auto-generated http_server_requests_seconds{uri=\"/fallback/{service}\",status=\"503\"} series directly: that series doesn't exist at all until the first trip, so its first-ever sample jumps straight from nothing to 1 with no preceding sample for rate()/increase() to compare against -- a single circuit-breaker trip was architecturally invisible no matter the rate window. Scraping every pod individually (see prometheus.yaml) means a failure on either replica is always captured too, instead of only showing up when Prometheus happened to scrape the one replica that saw it.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "100 * sum by (job, protocol) (label_replace(rate(http_server_requests_seconds_count{uri!~\"/actuator.*\", uri!=\"/fallback/{service}\", status=~\"5..\"}[20s]), \"protocol\", \"http\", \"job\", \"(.*)\") or label_replace(rate(gateway_fallback_requests_total[20s]), \"protocol\", \"http\", \"job\", \"(.*)\") or label_replace(rate(grpc_server_processing_duration_seconds_count{statusCode!=\"OK\"}[20s]), \"protocol\", \"grpc\", \"job\", \"(.*)\") or label_replace(rate(spring_kafka_listener_seconds_count{result!=\"success\"}[20s]), \"protocol\", \"kafka\", \"job\", \"(.*)\")) / sum by (job, protocol) (label_replace(rate(http_server_requests_seconds_count{uri!~\"/actuator.*\"}[20s]), \"protocol\", \"http\", \"job\", \"(.*)\") or label_replace(rate(grpc_server_processing_duration_seconds_count[20s]), \"protocol\", \"grpc\", \"job\", \"(.*)\") or label_replace(rate(spring_kafka_listener_seconds_count[20s]), \"protocol\", \"kafka\", \"job\", \"(.*)\"))",
              "legendFormat": "{{job}} ({{protocol}})"
            }
          ]
        },
        {
          "id": 3,
          "title": "Average request latency (per service and protocol)",
          "description": "Sum/count ratio per protocol family, actuator endpoints excluded from the HTTP terms so health-check and scrape latency don't skew real request latency.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (job, protocol) (label_replace(rate(http_server_requests_seconds_sum{uri!~\"/actuator.*\"}[20s]), \"protocol\", \"http\", \"job\", \"(.*)\") or label_replace(rate(grpc_server_processing_duration_seconds_sum[20s]), \"protocol\", \"grpc\", \"job\", \"(.*)\") or label_replace(rate(spring_kafka_listener_seconds_sum[20s]), \"protocol\", \"kafka\", \"job\", \"(.*)\")) / sum by (job, protocol) (label_replace(rate(http_server_requests_seconds_count{uri!~\"/actuator.*\"}[20s]), \"protocol\", \"http\", \"job\", \"(.*)\") or label_replace(rate(grpc_server_processing_duration_seconds_count[20s]), \"protocol\", \"grpc\", \"job\", \"(.*)\") or label_replace(rate(spring_kafka_listener_seconds_count[20s]), \"protocol\", \"kafka\", \"job\", \"(.*)\"))",
              "legendFormat": "{{job}} ({{protocol}})"
            }
          ]
        },
        {
          "id": 4,
          "title": "Kafka consumer lag (per service, topic)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "max(kafka_consumer_fetch_manager_records_lag) by (job, topic)",
              "legendFormat": "{{job}} / {{topic}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Circuit breaker state (api-gateway)",
          "description": "Only api-gateway has circuit breakers (transaction-service-cb, reporting-service-cb) -- it's the only service this panel will show data for. api-gateway runs 2 replicas, each reporting its own per-pod state since Prometheus scrapes every pod individually (see prometheus.yaml); max by (name, state) collapses that per-pod dimension so each breaker shows one row per state rather than one row per (state, pod) -- max is equivalent to logical OR here since the underlying gauge is 0/1, so a state only shows as active if at least one replica is actually in it (open if either replica is open).",
          "type": "state-timeline",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "max by (name, state) (resilience4j_circuitbreaker_state) == 1",
              "legendFormat": "{{name}}: {{state}}"
            }
          ]
        }
      ]
    }
