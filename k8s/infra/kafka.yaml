# Kafka — single broker, same config as docker-compose.yml, but with a PVC for
# its log segments so data survives pod restarts (the explicit ask for this
# k8s rehearsal; docker-compose.yml doesn't persist this today either).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: credit-card
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: credit-card
  labels:
    app: kafka
    tier: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        tier: infra
    spec:
      # Kubernetes auto-injects a KAFKA_PORT env var into every pod in this
      # namespace because a Service here is named "kafka" (Docker-links-style
      # discovery) — cp-kafka's own startup script treats any set KAFKA_PORT
      # as the deprecated single-port config and refuses to start. Disabling
      # service-link env injection avoids the collision; DNS resolution of
      # the "kafka" Service name is unaffected.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-zookeeper
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z zookeeper 2181; do echo waiting for zookeeper; sleep 2; done
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # Not set in docker-compose.yml (image default is ~1G heap) — explicitly
            # tuned down here to fit this rehearsal's memory budget.
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms512M"
          ports:
            - containerPort: 9092
              name: broker
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1200Mi
          # kafka-topics spawns a full JVM on every invocation (several seconds just
          # to boot the JVM and connect) — the default 1s probe timeout isn't enough
          # and was causing the liveness probe to "fail" on slowness alone, killing
          # an otherwise-healthy broker in a restart loop. Generous timeoutSeconds
          # fixes it.
          readinessProbe:
            exec:
              command: ["kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: credit-card
  labels:
    app: kafka
spec:
  # Headless + publishNotReadyAddresses: the single broker's own controller
  # thread connects to itself via "kafka:9092" as part of normal startup,
  # before it has passed its own readinessProbe. A regular ClusterIP Service
  # only resolves/routes to Ready endpoints, which deadlocks a single-broker
  # setup (it can never become Ready because it can't reach itself to become
  # Ready). This is the standard fix for Kafka/Zookeeper-style workloads.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
