apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-service
  namespace: credit-card
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authorization-service
  template:
    metadata:
      labels:
        app: authorization-service
    spec:
      initContainers:
        - name: wait-for-cockroachdb
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://cockroachdb:8080/health?ready=1; do echo waiting for cockroachdb; sleep 2; done']
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done']
      containers:
        - name: authorization-service
          image: credit-card/authorization-service:local
          imagePullPolicy: Never
          # runAsUser: 999 matches this image's actual Dockerfile-created
          # appuser uid (confirmed via docker run --entrypoint id); see
          # transaction-service/deployment.yaml for the longer explanation of
          # why this matters and why every manifest previously had this wrong
          # (hardcoded 1000, matching no image).
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          ports:
            - containerPort: 8082
              name: management
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m -XX:MaxMetaspaceSize=128m"
          envFrom:
            - secretRef:
                name: authorization-service-secrets
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
