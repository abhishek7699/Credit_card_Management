apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: credit-card
  labels:
    app: transaction-service
spec:
  type: ClusterIP
  selector:
    app: transaction-service
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: management
      port: 8081
      targetPort: 8081
      protocol: TCP
