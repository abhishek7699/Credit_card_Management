apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: credit-card
  labels:
    app: transaction-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      serviceAccountName: transaction-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: transaction-service
          image: registry.gitlab.com/creditcard/transaction-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
              name: grpc
            - containerPort: 8081
              name: management
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: datasource-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: kafka-bootstrap-servers
            - name: SPRING_VAULT_HOST
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-host
            - name: SPRING_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-token
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
