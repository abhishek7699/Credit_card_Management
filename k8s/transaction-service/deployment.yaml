apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: credit-card
  labels:
    app: transaction-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      initContainers:
        - name: wait-for-cockroachdb
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://cockroachdb:8080/health?ready=1; do echo waiting for cockroachdb; sleep 2; done']
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done']
        - name: wait-for-vault
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z vault 8200; do echo waiting for vault; sleep 2; done']
      containers:
        - name: transaction-service
          image: credit-card/transaction-service:local
          imagePullPolicy: Never
          # Container-level (not pod-level), so it doesn't also apply to the
          # busybox initContainers above, which run as root by default.
          # runAsUser: 101 matches the actual Dockerfile-created "appuser"
          # (confirmed via `docker run --entrypoint id`) -- Kubernetes can't
          # verify runAsNonRoot against a named USER directive, it needs the
          # real numeric uid. The other 6 services' appuser is uid 999, not
          # 101 -- each image was built independently and got a different
          # system uid. Every manifest in this repo previously hardcoded
          # runAsUser: 1000, which matches neither and also broke writing to
          # the chowned /app/logs directory.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
          ports:
            - containerPort: 9090
              name: grpc
            - containerPort: 8081
              name: management
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m -XX:MaxMetaspaceSize=128m"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: datasource-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: kafka-bootstrap-servers
            # VAULT_ADDR/VAULT_HOST/VAULT_PORT/VAULT_SCHEME/VAULT_TOKEN (unprefixed)
            # are what application.yml's vault.host/port/scheme/token properties
            # actually bind to. This manifest previously only set the SPRING_VAULT_*
            # variants, which don't feed those properties at all -- a real,
            # pre-existing bug fixed here to match docker-compose.yml's working set.
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-addr
            - name: VAULT_HOST
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-host
            - name: VAULT_PORT
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-port
            - name: VAULT_SCHEME
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-scheme
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-token
            - name: SPRING_VAULT_HOST
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-host
            - name: SPRING_VAULT_PORT
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-port
            - name: SPRING_VAULT_SCHEME
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-scheme
            - name: SPRING_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: transaction-service-secrets
                  key: vault-token
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
